{% extends 'layout.html' %}

{% block title %}
    View My Ratings
{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>My Evaluations</h2>

  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Instructor</th>
          <th>Narrative</th>
        </tr>
      </thead>
      <tbody>
        {% for r in ratings %}
          <tr>
            <td>{{ r.rating_date|date:"M d, Y" }}</td>

            <td>{{ r.instructor }}</td>

            <td>
              {{ r.narrative }}
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3" class="text-center">
              No evaluations found.
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
